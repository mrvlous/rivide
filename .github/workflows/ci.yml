name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-linux:
    name: Build & Test (Linux - ${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-format clang-tidy

      - name: Check System Environment
        run: make check

      - name: Verify Code Formatting
        run: make check-format

      - name: Build Library and Test Binaries
        run: make build CC=${{ matrix.compiler }}

      - name: Run Automated Unit Tests
        run: make test

      - name: Run NIST Known Answer Tests (KAT)
        run: make kat

      - name: Run Dudect Constant-Time Statistical Verification
        run: make timing

      - name: Execute Demonstration Examples
        run: make run-examples

      - name: Static Code Analysis (Lint)
        run: make lint CC=${{ matrix.compiler }}

  build-macos:
    name: Build & Test (macOS - Apple Clang)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: brew install cmake clang-format

      - name: Check System Environment
        run: make check

      - name: Verify Code Formatting
        run: make check-format

      - name: Build Library and Test Binaries
        run: make build CC=clang

      - name: Run Automated Unit Tests
        run: make test

      - name: Run NIST Known Answer Tests (KAT)
        run: make kat

      - name: Run Dudect Constant-Time Statistical Verification
        run: make timing

      - name: Execute Demonstration Examples
        run: make run-examples

  build-windows:
    name: Build & Test (Windows - MSVC)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DRIVIDE_BUILD_TESTS=ON -DRIVIDE_BUILD_EXAMPLES=ON

      - name: Build Library and Test Binaries
        run: cmake --build build --config Release

      - name: Run Automated Unit Tests
        run: cd build && ctest --output-on-failure -C Release

  test-node:
    name: Node.js Bindings (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build & Test Node.js Native Bindings
        run: |
          make node-build
          make node-test

  test-rust:
    name: Rust Bindings (${{ matrix.os }} - ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@stable

      - name: Build & Test Rust Crate
        working-directory: bindings/rust
        run: |
          cargo build --release
          cargo test --verbose
          cargo run --example kem_exchange
          cargo run --example dsa_sign
          cargo run --example hybrid_channel
